<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Admin - Nueva contraseña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: { brand: { 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#1d6fe9' } }
        }
      }
    };
  </script>
  <style>
    .glass-card { background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(59, 130, 246, 0.18); box-shadow: 0 25px 50px -12px rgba(2, 6, 23, 0.8), 0 0 40px -10px rgba(29, 111, 233, 0.25); }
    .light .glass-card { background: rgba(255, 255, 255, 0.88); border-color: rgba(226, 232, 240, 0.9); box-shadow: 0 25px 60px -15px rgba(29, 111, 233, 0.12), 0 0 25px -5px rgba(29, 111, 233, 0.08); }
    .mesh-gradient { background-color: #080d1a; background-image: radial-gradient(at 15% 15%, rgba(29, 111, 233, 0.25) 0, transparent 55%), radial-gradient(at 85% 85%, rgba(30, 64, 175, 0.3) 0, transparent 55%), radial-gradient(at 50% 50%, rgba(14, 165, 233, 0.12) 0, transparent 65%); }
    .light.mesh-gradient { background-color: #f1f5f9; background-image: radial-gradient(at 10% 10%, rgba(219, 234, 254, 0.85) 0, transparent 50%), radial-gradient(at 90% 90%, rgba(191, 219, 254, 0.6) 0, transparent 50%); }
    .app-alert { display: flex; align-items: flex-start; gap: 0.65rem; width: 100%; padding: 0.75rem 0.8rem; border: 1px solid transparent; border-radius: 0.75rem; box-shadow: 0 10px 25px rgba(2, 6, 23, 0.25); font-size: 0.75rem; line-height: 1.1rem; }
    .app-alert-success { color: #166534; background: #dcfce7; border-color: #86efac; }
    .app-alert-error { color: #991b1b; background: #fee2e2; border-color: #fca5a5; }
    .app-alert-info { color: #075985; background: #e0f2fe; border-color: #7dd3fc; }
    .app-alert-icon { display: inline-flex; flex: 0 0 auto; width: 1rem; height: 1rem; }
    .app-alert-message { flex: 1; }
    .app-alert-close { flex: 0 0 auto; margin-left: auto; color: currentColor; opacity: 0.55; font-size: 1.1rem; line-height: 1rem; }
    .app-alert-close:hover { opacity: 1; }
    .password-rule { display: flex; align-items: center; gap: 0.45rem; }
    .password-rule.valid { color: #4ade80; }
    .password-rule-icon { display: inline-flex; width: 1rem; justify-content: center; font-weight: 700; }
  </style>
</head>
<body class="h-full mesh-gradient text-slate-100 transition-colors duration-500 font-sans antialiased flex flex-col justify-between selection:bg-brand-500 selection:text-white">
  <div id="alertContainer" class="fixed top-4 right-4 z-[60] flex w-[calc(100%-2rem)] max-w-sm flex-col gap-3" aria-live="polite"></div>

  <div class="fixed top-6 right-6 z-50">
    <button id="themeToggle" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 hover:text-white border border-slate-700/60 shadow-lg transition-all backdrop-blur-md flex items-center gap-2 text-xs font-medium">
      <span id="themeIcon">☀️</span><span id="themeText">Modo Claro</span>
    </button>
  </div>

  <main class="flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8 relative z-10">
    <div class="w-full max-w-[520px]">
      <div class="glass-card rounded-3xl p-8 sm:p-10 transition-all duration-300">
        <div class="flex flex-col items-center text-center">
          <div class="mb-6 flex h-[96px] w-[96px] items-center justify-center" aria-label="Logo de Chat Admin">
            <svg class="h-full w-full" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#1d6fe9" d="M12 3C6.477 3 2 6.8 2 11.5c0 2.8 1.5 5.3 4 6.8L4.5 21l4.2-1.7c1 .3 2.1.5 3.3.5 5.523 0 10-3.8 10-8.3S17.523 3 12 3Z"></path>
              <circle cx="8" cy="11.5" r="1" fill="white"></circle><circle cx="12" cy="11.5" r="1" fill="white"></circle><circle cx="16" cy="11.5" r="1" fill="white"></circle>
            </svg>
          </div>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white" id="titleText">Nueva contraseña</h1>
          <p class="mt-2 text-sm font-medium text-slate-400" id="subText">Escribe tu nueva contraseña</p>
        </div>

        <div class="relative my-7 mb-10"><div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-700/60" id="dividerLine"></div></div></div>

        <form id="resetForm" class="space-y-5" novalidate onsubmit="event.preventDefault(); handleReset();">
          <div class="space-y-1.5">
            <label for="newPassword" class="block text-xs font-semibold text-slate-300 tracking-wider" id="labelNewPassword">Nueva contraseña</label>
            <div class="relative group">
              <input type="password" id="newPassword" oninput="updatePasswordRules(); clearPasswordError()" class="w-full px-4 pr-14 py-3 bg-slate-900/70 border border-slate-700/80 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/25 transition-all shadow-inner" />
              <button type="button" onclick="togglePassword('newPassword', 'newPasswordToggle')" id="newPasswordToggle" class="absolute inset-y-0 right-0 z-10 flex w-12 items-center justify-center text-slate-400 hover:text-slate-200 transition-colors focus:outline-none" aria-label="Mostrar contraseña" aria-pressed="false">
                <svg data-eye-open class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg data-eye-closed class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                </svg>
              </button>
            </div>
            <p id="passwordError" class="hidden text-xs text-red-400" role="alert"></p>
          </div>

          <div class="space-y-2 text-xs text-slate-400" aria-live="polite">
            <p class="font-semibold text-slate-300">La contraseña debe contener:</p>
            <p class="password-rule" id="ruleLength"><span class="password-rule-icon" id="ruleLengthIcon">○</span><span>Entre 8 y 20 caracteres</span></p>
            <p class="password-rule" id="ruleUppercase"><span class="password-rule-icon" id="ruleUppercaseIcon">○</span><span>1 mayúscula</span></p>
            <p class="password-rule" id="ruleNumber"><span class="password-rule-icon" id="ruleNumberIcon">○</span><span>1 número</span></p>
            <p class="password-rule" id="ruleSymbol"><span class="password-rule-icon" id="ruleSymbolIcon">○</span><span>1 símbolo</span></p>
          </div>

          <div class="space-y-1.5">
            <label for="confirmPassword" class="block text-xs font-semibold text-slate-300 tracking-wider" id="labelConfirmPassword">Confirmar contraseña</label>
            <input type="password" id="confirmPassword" oninput="clearPasswordError()" class="w-full px-4 pr-14 py-3 bg-slate-900/70 border border-slate-700/80 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/25 transition-all shadow-inner" />
          </div>

          <button id="saveButton" type="submit" class="w-full py-3.5 px-6 rounded-xl font-semibold text-sm text-white bg-gradient-to-r from-brand-600 via-brand-500 to-indigo-600 hover:from-brand-500 hover:via-brand-400 hover:to-indigo-500 active:scale-[0.98] shadow-lg shadow-brand-600/30 transition-all duration-200">Guardar contraseña</button>
        </form>

        <a href="index.html" class="mt-5 block text-center text-sm font-medium text-brand-400 hover:text-brand-300 hover:underline transition-colors">Volver a iniciar sesión</a>
      </div>
    </div>
  </main>

  <script>
    function showAlert(message, type = 'info') {
      const container = document.getElementById('alertContainer');
      const alertType = ['success', 'error', 'info'].includes(type) ? type : 'info';
      const alertElement = document.createElement('div');
      const icons = { success: '✓', error: '!', info: 'i' };
      alertElement.className = `app-alert app-alert-${alertType}`;
      alertElement.setAttribute('role', 'alert');
      alertElement.innerHTML = `<span class="app-alert-icon">${icons[alertType]}</span><span class="app-alert-message"></span><button class="app-alert-close" type="button" aria-label="Cerrar alerta">×</button>`;
      alertElement.querySelector('.app-alert-message').textContent = message;
      alertElement.querySelector('.app-alert-close').addEventListener('click', () => alertElement.remove());
      container.appendChild(alertElement);
      setTimeout(() => alertElement.remove(), 5000);
    }

    function togglePassword(fieldId, buttonId) {
      const field = document.getElementById(fieldId);
      const button = document.getElementById(buttonId);
      const eyeOpen = button.querySelector('[data-eye-open]');
      const eyeClosed = button.querySelector('[data-eye-closed]');
      const isVisible = field.type === 'password';

      field.type = isVisible ? 'text' : 'password';
      eyeOpen.classList.toggle('hidden', isVisible);
      eyeClosed.classList.toggle('hidden', !isVisible);
      button.setAttribute('aria-label', isVisible ? 'Ocultar contraseña' : 'Mostrar contraseña');
      button.setAttribute('aria-pressed', String(isVisible));
    }

    function showPasswordError(message) {
      const error = document.getElementById('passwordError');
      ['newPassword', 'confirmPassword'].forEach((id) => {
        const field = document.getElementById(id);
        field.classList.remove('border-slate-700/80', 'border-slate-300', 'focus:border-brand-500', 'focus:ring-brand-500/25');
        field.classList.add('border-red-500', 'focus:border-red-500', 'focus:ring-red-500/25');
        field.setAttribute('aria-invalid', 'true');
      });
      document.getElementById('labelNewPassword').classList.add('text-red-400');
      document.getElementById('labelConfirmPassword').classList.add('text-red-400');
      error.textContent = message;
      error.classList.remove('hidden');
    }

    function clearPasswordError() {
      const isLight = document.body.classList.contains('light');
      ['newPassword', 'confirmPassword'].forEach((id) => {
        const field = document.getElementById(id);
        field.classList.remove('border-red-500', 'focus:border-red-500', 'focus:ring-red-500/25');
        field.classList.add(isLight ? 'border-slate-300' : 'border-slate-700/80', 'focus:border-brand-500', 'focus:ring-brand-500/25');
        field.removeAttribute('aria-invalid');
      });
      ['labelNewPassword', 'labelConfirmPassword'].forEach((id) => {
        const label = document.getElementById(id);
        label.classList.remove('text-red-400');
        label.classList.add(isLight ? 'text-slate-700' : 'text-slate-300');
      });
      document.getElementById('passwordError').classList.add('hidden');
    }

    function updatePasswordRules() {
      const password = document.getElementById('newPassword').value;
      const rules = {
        ruleLength: password.length >= 8 && password.length <= 20,
        ruleUppercase: /[A-Z]/.test(password),
        ruleNumber: /\d/.test(password),
        ruleSymbol: /[^A-Za-z0-9]/.test(password)
      };

      Object.entries(rules).forEach(([ruleId, isValid]) => {
        const rule = document.getElementById(ruleId);
        const icon = document.getElementById(`${ruleId}Icon`);
        rule.classList.toggle('valid', isValid);
        icon.textContent = isValid ? '✓' : '○';
      });
    }

    function handleReset() {
      const password = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('confirmPassword').value;
      clearPasswordError();

      if (!password || !confirmation) {
        showPasswordError('Completa ambos campos de contraseña.');
        return;
      }
      if (!/^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,20}$/.test(password)) {
        showPasswordError('La contraseña debe tener entre 8 y 20 caracteres, una mayúscula, un número y un símbolo.');
        return;
      }
      if (password !== confirmation) {
        showPasswordError('Las contraseñas no coinciden.');
        return;
      }

      document.getElementById('saveButton').disabled = true;
      document.getElementById('saveButton').textContent = 'Guardando...';
      setTimeout(() => {
        window.location.href = 'index.html?passwordReset=success';
      }, 600);
    }

    function applyInputTheme() {
      const isLight = document.body.classList.contains('light');
      const inputClass = isLight
        ? 'w-full px-4 pr-14 py-3 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/25 transition-all shadow-sm'
        : 'w-full px-4 pr-14 py-3 bg-slate-900/70 border border-slate-700/80 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/25 transition-all shadow-inner';
      document.getElementById('newPassword').className = inputClass;
      document.getElementById('confirmPassword').className = inputClass;
    }

    const themeToggleBtn = document.getElementById('themeToggle');
    const body = document.body;
    let isDark = true;
    themeToggleBtn.addEventListener('click', () => {
      isDark = !isDark;
      body.classList.toggle('light', !isDark);
      document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
      document.getElementById('themeText').textContent = isDark ? 'Modo Claro' : 'Modo Oscuro';
      document.getElementById('titleText').className = isDark ? 'text-2xl sm:text-3xl font-extrabold tracking-tight text-white' : 'text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900';
      document.getElementById('subText').className = isDark ? 'mt-2 text-sm font-medium text-slate-400' : 'mt-2 text-sm font-medium text-slate-600';
      document.getElementById('dividerLine').className = isDark ? 'w-full border-t border-slate-700/60' : 'w-full border-t border-slate-200';
      applyInputTheme();
      clearPasswordError();
    });
  </script>
</body>
</html>
