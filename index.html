<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Admin - Acceso Seguro</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#1d6fe9',
            }
          },
          animation: {
            'glow-pulse': 'glow 6s ease-in-out infinite alternate',
          },
          keyframes: {
            glow: {
              '0%': { opacity: '0.4', transform: 'scale(0.98)' },
              '100%': { opacity: '0.8', transform: 'scale(1.04)' },
            },
          }
        }
      }
    }
  </script>
  <style>
    /* Efecto de cristal esmerilado con borde bioluminiscente */
    .glass-card {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(59, 130, 246, 0.18);
      box-shadow: 0 25px 50px -12px rgba(2, 6, 23, 0.8), 0 0 40px -10px rgba(29, 111, 233, 0.25);
    }
    
    .light .glass-card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 25px 60px -15px rgba(29, 111, 233, 0.12), 0 0 25px -5px rgba(29, 111, 233, 0.08);
    }

    /* Fondo degradado moderno en malla */
    .mesh-gradient {
      background-color: #080d1a;
      background-image: 
        radial-gradient(at 15% 15%, rgba(29, 111, 233, 0.25) 0px, transparent 55%),
        radial-gradient(at 85% 85%, rgba(30, 64, 175, 0.3) 0px, transparent 55%),
        radial-gradient(at 50% 50%, rgba(14, 165, 233, 0.12) 0px, transparent 65%);
    }

    .light.mesh-gradient {
      background-color: #f1f5f9;
      background-image: 
        radial-gradient(at 10% 10%, rgba(219, 234, 254, 0.85) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(191, 219, 254, 0.6) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(241, 245, 249, 0.8) 0px, transparent 70%);
    }

    .app-alert {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      width: 100%;
      padding: 0.75rem 0.8rem;
      border: 1px solid transparent;
      border-radius: 0.75rem;
      box-shadow: 0 10px 25px rgba(2, 6, 23, 0.25);
      font-size: 0.75rem;
      line-height: 1.1rem;
      animation: alert-in 180ms ease-out;
    }

    .app-alert-success {
      color: #166534;
      background: #dcfce7;
      border-color: #86efac;
    }

    .app-alert-error {
      color: #991b1b;
      background: #fee2e2;
      border-color: #fca5a5;
    }

    .app-alert-info {
      color: #075985;
      background: #e0f2fe;
      border-color: #7dd3fc;
    }

    .app-alert-icon {
      display: inline-flex;
      flex: 0 0 auto;
      width: 1rem;
      height: 1rem;
      margin-top: 0.05rem;
    }

    .app-alert-message {
      flex: 1;
    }

    .app-alert-close {
      flex: 0 0 auto;
      margin-left: auto;
      color: currentColor;
      opacity: 0.55;
      font-size: 1.1rem;
      line-height: 1rem;
      transition: opacity 150ms ease;
    }

    .app-alert-close:hover {
      opacity: 1;
    }

    @keyframes alert-in {
      from { opacity: 0; transform: translateY(-0.5rem); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="h-full mesh-gradient text-slate-100 transition-colors duration-500 font-sans antialiased flex flex-col justify-between selection:bg-brand-500 selection:text-white">

  <div id="alertContainer" class="fixed top-4 right-4 z-[60] flex w-[calc(100%-2rem)] max-w-sm flex-col gap-3" aria-live="polite"></div>

  <!-- Botón flotante para alternar Modo Oscuro / Modo Claro -->
  <div class="fixed top-6 right-6 z-50">
    <button id="themeToggle" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 hover:text-white border border-slate-700/60 shadow-lg transition-all backdrop-blur-md flex items-center gap-2 text-xs font-medium">
      <span id="themeIcon">☀️</span>
      <span id="themeText">Modo Claro</span>
    </button>
  </div>

  <!-- Luces ambientales decorativas -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-brand-600/20 rounded-full blur-3xl animate-glow-pulse"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl animate-glow-pulse" style="animation-delay: 2s;"></div>
  </div>

  <!-- Contenedor Principal (Siempre Centrado) -->
  <main class="flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8 relative z-10">
    <div class="w-full max-w-[430px]">
      
      <!-- Tarjeta Principal con Estilo de Vidrio Esmerilado -->
      <div class="glass-card rounded-3xl p-8 sm:p-10 transition-all duration-300">
        
        <!-- Logo y encabezado del formulario -->
        <div class="flex flex-col items-center text-center">
          
          <!-- Logo de chat -->
          <div class="mb-6 flex h-[96px] w-[96px] items-center justify-center" aria-label="Logo de Chat Admin">
            <svg class="h-full w-full" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#1d6fe9" d="M12 3C6.477 3 2 6.8 2 11.5c0 2.8 1.5 5.3 4 6.8L4.5 21l4.2-1.7c1 .3 2.1.5 3.3.5 5.523 0 10-3.8 10-8.3S17.523 3 12 3Z"></path>
              <circle cx="8" cy="11.5" r="1" fill="white"></circle>
              <circle cx="12" cy="11.5" r="1" fill="white"></circle>
              <circle cx="16" cy="11.5" r="1" fill="white"></circle>
            </svg>
          </div>

          <!-- Título y Subtítulo con tipografía de alto impacto -->
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white transition-colors duration-300" id="titleText">
            Chat <span class="bg-gradient-to-r from-brand-400 via-cyan-300 to-brand-200 bg-clip-text text-transparent">Admin</span>
          </h1>
          <p class="mt-2 text-xs sm:text-sm font-medium text-slate-400 transition-colors duration-300" id="subText">
            Panel de administración y control centralizado
          </p>
        </div>

        <!-- Divisor moderno con brillo central -->
        <div class="relative my-7">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-700/60 transition-colors duration-300" id="dividerLine"></div>
          </div>
          <div class="relative flex justify-center text-xs">
            <span class="bg-slate-900/90 px-3 py-0.5 rounded-full text-[11px] font-semibold text-slate-500 tracking-wider transition-colors duration-300" id="dividerBadge">
              Credenciales
            </span>
          </div>
        </div>

        <!-- Formulario -->
        <form class="space-y-5" novalidate onsubmit="event.preventDefault(); handleLogin();">
          
          <!-- Campo 1: Correo o Usuario -->
          <div class="space-y-1.5">
            <label for="username" class="block text-xs font-semibold text-slate-300 tracking-wider transition-colors" id="labelUser">
              Usuario o Correo
            </label>
            <div class="relative group">
              <!-- Icono Izquierdo -->
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-brand-400 transition-colors">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
              <input 
                type="text" 
                id="username" 
                oninput="clearFieldError('username')"
                required
                placeholder="admin@empresa.com" 
                class="w-full pl-11 pr-4 py-3 bg-slate-900/70 border border-slate-700/80 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/25 transition-all shadow-inner"
              />
            </div>
            <p id="usernameError" class="hidden text-xs text-red-400" role="alert"></p>
          </div>

          <!-- Campo 2: Contraseña con Toggle de visibilidad -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between">
              <label for="password" class="block text-xs font-semibold text-slate-300 tracking-wider transition-colors" id="labelPass">
                Contraseña
              </label>
              <a href="forgot-password.html" class="text-xs font-medium text-brand-400 hover:text-brand-300 hover:underline transition-colors">
                ¿Olvidaste tu contraseña?
              </a>
            </div>
            <div class="relative group">
              <!-- Icono Candado -->
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-brand-400 transition-colors">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </div>
              <!-- Input -->
              <input 
                type="password" 
                id="password" 
                oninput="clearFieldError('password')"
                required
                placeholder="••••••••••••" 
                class="w-full pl-11 pr-14 py-3 bg-slate-900/70 border border-slate-700/80 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/25 transition-all shadow-inner"
              />
              <!-- Botón Ver/Ocultar Contraseña -->
              <button 
                type="button" 
                onclick="togglePassword()"
                class="absolute inset-y-0 right-0 z-10 flex w-12 items-center justify-center text-slate-400 hover:text-slate-200 transition-colors focus:outline-none"
                title="Mostrar u ocultar contraseña"
                aria-label="Mostrar contraseña"
                aria-pressed="false"
              >
                <!-- Icono Ojo Abierto -->
                <svg id="eyeOpen" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <!-- Icono Ojo Tachado (Oculto por defecto) -->
                <svg id="eyeClosed" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                </svg>
              </button>
            </div>
            <p id="passwordError" class="hidden text-xs text-red-400" role="alert"></p>
          </div>

          <!-- Botón de Acción Principal (Con degradado ostentoso e interactividad) -->
          <div class="pt-2">
            <button 
              type="submit" 
              id="submitBtn"
              class="w-full py-3.5 px-6 rounded-xl font-semibold text-sm text-white bg-gradient-to-r from-brand-600 via-brand-500 to-indigo-600 hover:from-brand-500 hover:via-brand-400 hover:to-indigo-500 active:scale-[0.98] shadow-lg shadow-brand-600/30 hover:shadow-brand-500/50 transition-all duration-200 flex items-center justify-center gap-2 group cursor-pointer"
            >
              <span id="btnText">Iniciar sesión</span>
              <svg id="btnArrow" class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
              <!-- Spinner de carga animado -->
              <svg id="btnSpinner" class="w-5 h-5 animate-spin hidden text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
              </svg>
            </button>
          </div>
        </form>

      </div>

      <!-- Footer / Medidas de Seguridad -->
      <div class="mt-8 text-center flex flex-col items-center justify-center gap-2">
        <div class="flex items-center gap-1.5 text-[11px] font-medium text-slate-400">
          <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
          <span>Conexión segura cifrada con TLS 1.3 de extremo a extremo</span>
        </div>
        <p class="text-[11px] text-slate-400">
          &copy; 2026 Chat Admin System. Todos los derechos reservados.
        </p>
      </div>

    </div>
  </main>

  <!-- Lógica Interactiva (JavaScript) -->
  <script>
    // 1. Alternar Mostrar / Ocultar Contraseña
    function togglePassword() {
      const passInput = document.getElementById('password');
      const eyeOpen = document.getElementById('eyeOpen');
      const eyeClosed = document.getElementById('eyeClosed');

      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeOpen.classList.add('hidden');
        eyeClosed.classList.remove('hidden');
        document.querySelector('#password + button').setAttribute('aria-label', 'Ocultar contraseña');
        document.querySelector('#password + button').setAttribute('aria-pressed', 'true');
      } else {
        passInput.type = 'password';
        eyeOpen.classList.remove('hidden');
        eyeClosed.classList.add('hidden');
        document.querySelector('#password + button').setAttribute('aria-label', 'Mostrar contraseña');
        document.querySelector('#password + button').setAttribute('aria-pressed', 'false');
      }
    }

    // 2. Validación y simulación del inicio de sesión
    function showFieldError(fieldId, labelId, errorId, message) {
      const field = document.getElementById(fieldId);
      const label = document.getElementById(labelId);
      const error = document.getElementById(errorId);

      field.classList.remove('border-slate-700/80', 'border-slate-300', 'focus:border-brand-500', 'focus:ring-brand-500/25');
      field.classList.add('border-red-500', 'focus:border-red-500', 'focus:ring-red-500/25');
      field.setAttribute('aria-invalid', 'true');
      label.classList.remove('text-slate-300', 'text-slate-700');
      label.classList.add('text-red-400');
      error.textContent = message;
      error.classList.remove('hidden');
    }

    function clearFieldError(fieldId) {
      const field = document.getElementById(fieldId);
      const isLight = document.body.classList.contains('light');
      const labelId = fieldId === 'username' ? 'labelUser' : 'labelPass';
      const errorId = fieldId === 'username' ? 'usernameError' : 'passwordError';
      const label = document.getElementById(labelId);
      const error = document.getElementById(errorId);

      field.classList.remove('border-red-500', 'focus:border-red-500', 'focus:ring-red-500/25');
      field.classList.add(isLight ? 'border-slate-300' : 'border-slate-700/80', 'focus:border-brand-500', 'focus:ring-brand-500/25');
      field.removeAttribute('aria-invalid');
      label.classList.remove('text-red-400');
      label.classList.add(isLight ? 'text-slate-700' : 'text-slate-300');
      error.textContent = '';
      error.classList.add('hidden');
    }

    function validateLoginForm() {
      const username = document.getElementById('username');
      const password = document.getElementById('password');
      let isValid = true;

      clearFieldError('username');
      clearFieldError('password');

      if (!username.value.trim()) {
        showFieldError('username', 'labelUser', 'usernameError', 'El campo Usuario o Correo es obligatorio.');
        isValid = false;
      }

      if (!password.value.trim()) {
        showFieldError('password', 'labelPass', 'passwordError', 'El campo Contraseña es obligatorio.');
        isValid = false;
      }

      return isValid;
    }

    function showAlert(message, type = 'info') {
      const container = document.getElementById('alertContainer');
      const alertType = ['success', 'error', 'info'].includes(type) ? type : 'info';
      const alertElement = document.createElement('div');
      const icon = document.createElement('span');
      const messageElement = document.createElement('span');
      const closeButton = document.createElement('button');

      const icons = {
        success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.5 2.5L16 9"></path></svg>',
        error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M9 9l6 6m0-6-6 6"></path></svg>',
        info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 10v6m0-9h.01"></path></svg>'
      };

      alertElement.className = `app-alert app-alert-${alertType}`;
      alertElement.setAttribute('role', 'alert');
      icon.className = 'app-alert-icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.innerHTML = icons[alertType];
      messageElement.className = 'app-alert-message';
      messageElement.textContent = message;
      closeButton.type = 'button';
      closeButton.className = 'app-alert-close';
      closeButton.setAttribute('aria-label', 'Cerrar alerta');
      closeButton.textContent = '×';
      closeButton.addEventListener('click', () => alertElement.remove());

      alertElement.append(icon, messageElement, closeButton);
      container.appendChild(alertElement);
      setTimeout(() => alertElement.remove(), 5000);
    }

    const passwordResetCompleted = new URLSearchParams(window.location.search).get('passwordReset') === 'success';
    if (passwordResetCompleted) {
      showAlert('La contraseña se actualizó correctamente.', 'success');
      window.history.replaceState({}, document.title, 'index.html');
    }

    const demoCredentials = {
      username: 'admin',
      password: '123'
    };

    function handleLogin() {
      if (!validateLoginForm()) return;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnArrow = document.getElementById('btnArrow');
      const btnSpinner = document.getElementById('btnSpinner');

      btn.disabled = true;
      btnText.textContent = "Autenticando...";
      btnArrow.classList.add('hidden');
      btnSpinner.classList.remove('hidden');

      setTimeout(() => {
        const credentialsAreValid = username === demoCredentials.username && password === demoCredentials.password;

        if (credentialsAreValid) {
          showAlert('Credenciales correctas. Abriendo el panel...', 'success');
          setTimeout(() => {
            window.location.href = 'two-factor.html';
          }, 700);
          return;
        }

        showAlert('El usuario no existe o la contraseña no es correcta.', 'error');
        btn.disabled = false;
        btnText.textContent = "Iniciar sesión";
        btnArrow.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
      }, 1400);
    }

    // 3. Alternar Tema Claro / Oscuro
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');
    const body = document.body;

    let isDark = true;

    themeToggleBtn.addEventListener('click', () => {
      isDark = !isDark;
      if (isDark) {
        body.classList.remove('light');
        themeIcon.textContent = "☀️";
        themeText.textContent = "Modo Claro";
        
        // Colores de textos oscuros
        document.getElementById('titleText').classList.add('text-white');
        document.getElementById('titleText').classList.remove('text-slate-900');
        document.getElementById('subText').classList.add('text-slate-400');
        document.getElementById('subText').classList.remove('text-slate-600');
        document.getElementById('dividerBadge').className = "bg-slate-900/90 px-3 py-0.5 rounded-full text-[11px] font-semibold text-slate-500 tracking-wider";
        document.getElementById('dividerLine').className = "w-full border-t border-slate-700/60";
        document.getElementById('labelUser').className = "block text-xs font-semibold text-slate-300 tracking-wider";
        document.getElementById('labelPass').className = "block text-xs font-semibold text-slate-300 tracking-wider";
        
        // Inputs
        document.getElementById('username').className = "w-full pl-11 pr-4 py-3 bg-slate-900/70 border border-slate-700/80 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/25 transition-all shadow-inner";
        document.getElementById('password').className = "w-full pl-11 pr-14 py-3 bg-slate-900/70 border border-slate-700/80 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/25 transition-all shadow-inner";
      } else {
        body.classList.add('light');
        themeIcon.textContent = "🌙";
        themeText.textContent = "Modo Oscuro";
        
        // Colores de textos claros
        document.getElementById('titleText').classList.remove('text-white');
        document.getElementById('titleText').classList.add('text-slate-900');
        document.getElementById('subText').classList.remove('text-slate-400');
        document.getElementById('subText').classList.add('text-slate-600');
        document.getElementById('dividerBadge').className = "bg-white px-3 py-0.5 rounded-full text-[11px] font-semibold text-slate-400 tracking-wider border border-slate-200";
        document.getElementById('dividerLine').className = "w-full border-t border-slate-200";
        document.getElementById('labelUser').className = "block text-xs font-semibold text-slate-700 tracking-wider";
        document.getElementById('labelPass').className = "block text-xs font-semibold text-slate-700 tracking-wider";

        // Inputs
        document.getElementById('username').className = "w-full pl-11 pr-4 py-3 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/25 transition-all shadow-sm";
